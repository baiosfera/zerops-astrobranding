# Bundle: Full Mesh Enterprise (10 Sovereign Services with Frugal Autoscaling)
services:
  # Managed Infrastructure (Priority 10)
  - hostname: database
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10

  - hostname: valkey
    type: valkey:single@7.2
    profile: hobby
    priority: 10

  - hostname: nats
    type: nats:single@2.12
    priority: 10

  - hostname: objectstorage
    type: object-storage
    objectStorageSize: 10
    priority: 10

  - hostname: localstorage
    type: local-storage:single@1
    priority: 10

  # Tier 1 Runtime: FreeLLMAPI (Priority 8)
  - hostname: freellmapi
    type: ubuntu/nodejs@24
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 8
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10

  # Tier 2 Runtimes: Bifrost AI Gateway & WhatsApp Engine (Priority 6)
  - hostname: bifrost
    type: alpine/go@1.22
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 6
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10

  - hostname: evolution
    type: alpine/go@1.22
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 6
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10

  # Tier 3 Runtime: Hermes Agent (Priority 4)
  - hostname: hermes
    type: ubuntu/python@3.12
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 4
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10

  # Tier 4 Runtime: AstroBranding Fullstack Webapp (Priority 2)
  - hostname: astrobranding
    type: ubuntu/bun@1.3.9
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 2
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
