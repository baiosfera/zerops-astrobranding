# Bundle: Brandview Visualizer Studio (SolidJS + Vite 6 + Hono Backend)
services:
  - hostname: brandview
    type: ubuntu/nodejs@22
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
