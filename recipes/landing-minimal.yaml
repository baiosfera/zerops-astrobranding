# Bundle: Landing Minimal Sovereign (AstroBranding + LocalStorage)
services:
  - hostname: localstorage
    type: local-storage:single@1
    priority: 10

  - hostname: astrobranding
    type: ubuntu/bun@1.3.9
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
