# Hito 2: Maxim AI Bifrost Enterprise Gateway
# Nota: La infraestructura base (database, valkey) se aprovisiona desde recipes/services/
services:
  - hostname: bifrost
    type: alpine/go@1.22
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
