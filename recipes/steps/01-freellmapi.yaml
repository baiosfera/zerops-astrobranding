# Hito 1: FreeLLMAPI Multi-Provider Proxy
# Nota: La infraestructura base (localstorage) se aprovisiona desde recipes/services/06-localstorage.yaml
services:
  - hostname: freellmapi
    type: ubuntu/nodejs@24
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
    envVariables:
      FREEAPI_ADMIN_EMAIL: ${FREEAPI_ADMIN_EMAIL_SECRET}
      FREEAPI_ADMIN_PASSWORD: ${FREEAPI_ADMIN_PASSWORD_SECRET}
      FREEAPI_CONFIG_JSON: ${FREEAPI_CONFIG_JSON_SECRET}
