# Hito 1: FreeLLMAPI Multi-Provider Proxy
# Nota: La infraestructura base (localstorage) se aprovisiona desde recipes/services/06-localstorage.yaml
services:
  - hostname: freellmapi
    type: ubuntu/nodejs@24
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
    # Inject service-only secrets (FREEAPI_CONFIG_JSON_SECRET, FREEAPI_ENCRYPTION_KEY) directly on
    # serviceHostname=freellmapi via `seed-freellmapi-keys.sh` / `zerops_env` (never Project Shared Vault);
    # runtime wiring lives in runtime-freellmapi/zerops.yaml.
