# Hito 6: S3 Object Storage + Astro-Web Sovereign Engine (Bun 1.3.9 Ubuntu)
# Arquitectura Canónica GitOps (Opción B ghcicd): Servicio principal en producción (rama main)
services:
  - hostname: objectstorage
    type: object-storage
    objectStorageSize: 10
    priority: 10

  # Entorno Producción / Primario (Trafico en vivo, pasarelas reales, rama main)
  - hostname: web
    type: ubuntu/bun@1.3.9
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 3
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
