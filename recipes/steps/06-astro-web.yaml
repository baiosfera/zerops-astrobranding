# Hito 6: S3 Object Storage + Astro-Web Sovereign Multi-Service Engine (Bun 1.3.9 Ubuntu)
# Arquitectura Canónica GitOps: astro-stage (rama stage) + astro-prod (rama main)
services:
  - hostname: objectstorage
    type: object-storage
    objectStorageSize: 10
    priority: 10

  # Entorno Staging (Pruebas aisladas, pasarelas sandbox, rama stage)
  - hostname: astro-stage
    type: ubuntu/bun@1.3.9
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10

  # Entorno Producción (Trafico en vivo, pasarelas reales, rama main)
  - hostname: astro-prod
    type: ubuntu/bun@1.3.9
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 3
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
