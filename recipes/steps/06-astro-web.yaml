# Hito 6: Astro-Web Sovereign Engine (Bun 1.3.9 Ubuntu)
# Arquitectura Canónica GitOps: Servicio principal en producción (rama main)
# Almacenamiento: localstorage por defecto. Si el proyecto escala y requiere S3 MinIO,
# se aprovisiona de forma aditiva e independiente vía recipes/services/04-objectstorage.yaml.
services:
  # Entorno Producción / Primario (Tráfico en vivo, pasarelas reales, rama main)
  - hostname: web
    type: ubuntu/bun@1.3.9
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 3
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
