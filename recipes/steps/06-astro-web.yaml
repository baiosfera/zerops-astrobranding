# Hito 6: S3 Object Storage + Astro-Web Sovereign Fullstack Engine (Bun 1.3.9 Ubuntu)
services:
  - hostname: objectstorage
    type: object-storage
    objectStorageSize: 10
    priority: 10

  - hostname: astrobranding
    type: ubuntu/bun@1.3.9
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
