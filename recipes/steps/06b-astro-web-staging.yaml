# Hito 6b: Entorno de Desarrollo / Preview para Astro-Web (Bun 1.4 Ubuntu, rama dev)
services:
  - hostname: webdev
    type: ubuntu/bun@1.4
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
