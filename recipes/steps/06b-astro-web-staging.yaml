# Hito 6b (Opcional): Entorno de Staging para Astro-Web (Bun 1.3.9 Ubuntu)
# Activación: Solo si el cliente o equipo requiere QA formal previo a main
services:
  - hostname: astrostage
    type: ubuntu/bun@1.3.9
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
