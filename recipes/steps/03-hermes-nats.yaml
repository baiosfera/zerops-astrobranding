# Hito 3: Hermes-Agent Copilot (Ubuntu Python 3.12)
# Nota: La infraestructura base (nats) se aprovisiona desde recipes/services/03-nats.yaml
services:
  - hostname: hermes
    type: ubuntu/python@3.12
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
