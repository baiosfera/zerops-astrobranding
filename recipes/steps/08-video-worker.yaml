# Hito 8: Motor Efímero de Renderizado de Video (Lego On-Demand / Costo Cero)
# Runtime Ubuntu Node.js 24 con FFmpeg y ObjectStorage S3 (sin localstorage co-ubicado).
# Desplegable bajo demanda para lotes de video y eliminable tras finalizar para costo cero.
services:
  - hostname: videoworker
    type: ubuntu/nodejs@24
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: false
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.5
      minFreeRamPercent: 15
    # Non-secret runtime vars (NATS_URL, VALKEY_URL, NODE_ENV, MAX_CONCURRENT_RENDERS,
    # VIDEO_OUTPUT_DIR) live in baiosfera/runtime-videoworker zerops.yaml run.envVariables.
