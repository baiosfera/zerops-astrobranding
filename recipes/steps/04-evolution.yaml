# Hito 4: EvolutionGo WhatsApp Engine (Go 1.22 Alpine / whatsmeow)
services:
  - hostname: evolution
    type: alpine/go@1.22
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
