# Hito 10: Paperclip Governance & Spend Caps Watchdog (Ubuntu Node.js 26)
# SSoT Persistence Contract:
# - PostgreSQL 18 managed database: DATABASE_URL disables @embedded-postgres saving ~400 MB RAM.
# - LocalStorage volume: Mounts at /mnt/localstorage in zerops.yaml (run.volume).
# - Zero ObjectStorage Redundancy: Native local_disk provider on persistent NVMe volume.
services:
  - hostname: paperclip
    type: ubuntu/nodejs@26
    priority: 7
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
    envVariables:
      PORT: "3100"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      DATABASE_URL: ${database_connectionString}
      BETTER_AUTH_SECRET: ${PAPERCLIP_BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_SIGNING_SECRET}
      PAPERCLIP_STORAGE_PROVIDER: "local_disk"
      PAPERCLIP_STORAGE_LOCAL_DIR: "/mnt/localstorage/paperclip/storage"
      PAPERCLIP_HOME: "/mnt/localstorage/paperclip"
      PAPERCLIP_ADMIN_EMAIL: ${PAPERCLIP_ADMIN_EMAIL_SECRET}
      PAPERCLIP_ADMIN_PASSWORD: ${PAPERCLIP_ADMIN_PASSWORD_SECRET}
      HERMES_GATEWAY_URL: "http://hermes:8000"
