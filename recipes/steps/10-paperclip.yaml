# Hito 10: Paperclip Governance & Spend Caps Watchdog (Ubuntu Node.js 26)
# SSoT Persistence Contract:
# - PostgreSQL 18 managed database: DATABASE_URL disables @embedded-postgres saving ~400 MB RAM.
# - LocalStorage volume: Mounts at /mnt/localstorage in zerops.yaml (run.volume).
# - Zero ObjectStorage Redundancy: Native local_disk provider on persistent NVMe volume.
services:
  - hostname: paperclip
    type: ubuntu/nodejs@26
    priority: 7
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
    # Runtime env vars (PORT, HOST, NODE_ENV, DATABASE_URL, HERMES_GATEWAY_URL, PAPERCLIP_*)
    # live in baiosfera/runtime-paperclip zerops.yaml; secrets belong in vault / zerops_env.
