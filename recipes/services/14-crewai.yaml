# Service: CrewAI & PydanticAI Dynamic Swarm Runtime (Ubuntu Python 3.12)
services:
  - hostname: crewai
    type: ubuntu/python@3.12
    priority: 8
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
