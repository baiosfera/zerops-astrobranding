# Service: EvolutionGo WhatsApp Messaging Engine (Go 1.26 on Ubuntu base)
services:
  - hostname: evolution
    type: ubuntu/go@1.22
    priority: 6
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
