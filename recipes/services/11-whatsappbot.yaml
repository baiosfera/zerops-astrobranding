# Service: Sovereign WhatsApp AI Agent Worker (Ubuntu Bun 1.3 / NATS JetStream Consumer)
# Runtime SSoT: Mounts localstorage at /mnt/localstorage in zerops.yaml (run.volume)
# Brand SSoT: Ingests /mnt/localstorage/${PROJECT_NAME}/dev/system_prompt.md (fallback seed: /var/www/baiosfera/PROYECTOS/${PROJECT_NAME})
# Upstream Gateway: Calls http://bifrost:8080/v1 with Bearer vk-production-main
services:
  - hostname: whatsappbot
    type: ubuntu/bun@1.3
    priority: 3
    startWithoutCode: true
    enableSubdomainAccess: false
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
