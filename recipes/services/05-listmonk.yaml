# Service: Listmonk Sovereign Email Marketing & Transactional Engine (Go 1.22 Alpine)
services:
  - hostname: listmonk
    type: alpine/go@1.22
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: SHARED
      minFreeRamGB: 0.25
      minFreeRamPercent: 10
