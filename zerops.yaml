zerops:
  # 1. Main Monorepo Service: Bun 1.4 + Astro 5 + Hono
  - setup: astrobranding
    build:
      base: bun@1.3.9
      os: ubuntu
      envVariables:
        BUN_INSTALL: ./.bun
      buildCommands:
        - bun install
        - bun run build
      deployFiles:
        - apps
        - packages
        - node_modules
        - package.json
        - bunfig.toml
      cache:
        - node_modules
        - .bun/install/cache
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: bun@1.3.9
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        NODE_ENV: production
        DATABASE_URL: ${database_connectionString}
        VALKEY_URL: ${valkey_connectionString}
        NATS_URL: ${nats_connectionString}
        BIFROST_GATEWAY_URL: "http://bifrost:8080/v1"
        EVOLUTION_GATEWAY_URL: "http://evolution:8085"
      start: bun run apps/astrobranding/dist/server/entry.mjs
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  # 2. Maxim AI Bifrost Enterprise AI Gateway (Go v2.2.3)
  - setup: bifrost
    build:
      base: alpine/go@1.22
      buildCommands:
        - curl -fsSL -o bifrost https://downloads.getmaxim.ai/bifrost/v2.2.3/linux/amd64/bifrost-http
        - chmod +x bifrost
        - mkdir -p data
        - cp apps/bifrost/config.json data/config.json
      deployFiles: .
      cache:
        - bifrost
    run:
      base: alpine/go@1.22
      volume:
        hostname: localstorage
        mountPath: /mnt/localstorage
        readOnly: false
      ports:
        - port: 8080
          httpSupport: true
      prepareCommands:
        - sudo apk add --no-cache ca-certificates tzdata
        - sudo mkdir -p /mnt/localstorage/bifrost
        - sudo chown -R zerops:zerops /mnt/localstorage/bifrost
      initCommands:
        - cp /var/www/data/config.json /mnt/localstorage/bifrost/config.json
        - chmod +x /var/www/bifrost
      start: /var/www/bifrost -app-dir /mnt/localstorage/bifrost -port 8080 -host 0.0.0.0 -log-level info -log-style json
      healthCheck:
        httpGet:
          port: 8080
          path: /health
      envVariables:
        APP_PORT: "8080"
        APP_HOST: "0.0.0.0"
        APP_DIR: "/mnt/localstorage/bifrost"
        GOMEMLIMIT: "900MiB"
        GOGC: "200"
        PG_HOST: ${database_hostname}
        PG_PORT: "5432"
        PG_USER: ${database_user}
        PG_PASSWORD: ${database_password}
        PG_DATABASE: ${database_dbName}
        DATABASE_URL: ${database_connectionString}
        BIFROST_DB_TYPE: "postgres"
        BIFROST_DB_DSN: ${database_connectionString}
        VALKEY_ADDR: "valkey:6379"
        VALKEY_PASSWORD: ${valkey_password}
        FREELLMAPI_URL: "http://freellmapi:3001/v1"
        FREELLMAPI_UNIFIED_KEY: "freellmapi-273e0696aa7e39dac2f950ced0b38e48afc4806f23b72786"
        BIFROST_ENCRYPTION_KEY: "9d8352b055dfd87e5a973a96927ac82b41e6b537af22637485b46c4714153690"
        BIFROST_VIRTUAL_KEY: "vk-production-main"

  # 3. FreeLLMAPI Multi-Provider Free Inference Proxy (Node.js 24)
  - setup: freellmapi
    build:
      base: ubuntu/nodejs@24
      buildCommands:
        - cd apps/freellmapi && npm ci && npm run build
      deployFiles: .
      cache:
        - ~/.npm
    run:
      base: ubuntu/nodejs@24
      volume:
        hostname: localstorage
        mountPath: /mnt/localstorage
        readOnly: false
      ports:
        - port: 3001
          httpSupport: true
      envVariables:
        PORT: 3001
        HOST: "0.0.0.0"
        NODE_ENV: "production"
        RESPONSE_CACHE: "true"
        RESPONSE_CACHE_PERSIST: "true"
        RESPONSE_CACHE_TTL_SECONDS: "86400"
        FREEAPI_DB_PATH: "/mnt/localstorage/freellmapi/freellmapi.db"
        FREEAPI_CONFIG_PATH: "/var/www/apps/freellmapi/config.json"
        ENCRYPTION_KEY: "c8e2b109e4d56f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a"
      prepareCommands:
        - sudo mkdir -p /mnt/localstorage/freellmapi
        - sudo chown -R zerops:zerops /mnt/localstorage/freellmapi
      initCommands:
        - test -f /var/www/apps/freellmapi/config.json || cp /var/www/apps/freellmapi/config.example.json /var/www/apps/freellmapi/config.json
      start: node apps/freellmapi/server/dist/index.js
      healthCheck:
        httpGet:
          port: 3001
          path: /api/ping

  # 4. EvolutionGo WhatsApp Engine (Go 1.22)
  - setup: evolution
    build:
      base: go@1.22
      os: alpine
      prepareCommands:
        - apk add --no-cache git gcc musl-dev
      buildCommands:
        - cd apps/evolution && go build -o evolution-go main.go
      deployFiles:
        - apps/evolution/evolution-go
      cache:
        - /go/pkg/mod
    run:
      base: alpine@3.21
      ports:
        - port: 8085
          httpSupport: true
      prepareCommands:
        - apk add --no-cache ca-certificates tzdata
      envVariables:
        SERVER_PORT: "8085"
        CLIENT_NAME: "astrobranding"
        POSTGRES_AUTH_DB: "postgresql://${database_user}:${database_password}@database:${database_port}/evogo_auth?sslmode=disable"
        POSTGRES_USERS_DB: "postgresql://${database_user}:${database_password}@database:${database_port}/evogo_users?sslmode=disable"
        DATABASE_SAVE_MESSAGES: "true"
        NATS_URL: ${nats_connectionString}
      start: ./apps/evolution/evolution-go
      healthCheck:
        httpGet:
          port: 8085
          path: /server/ok

  # 5. Nous Research Hermes-Agent Copilot (Python 3.12 Ubuntu)
  - setup: hermes
    build:
      base: python@3.12
      os: ubuntu
      buildCommands:
        - cd apps/hermes && pip install --upgrade pip setuptools wheel && pip install --target=./vendor -r requirements.txt
      deployFiles:
        - apps/hermes
      cacheFiles:
        - /root/.cache/pip
    run:
      base: python@3.12
      os: ubuntu
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        PORT: "8000"
        PYTHONPATH: "./apps/hermes/vendor:./apps/hermes"
        HERMES_MODEL_ENDPOINT: "http://bifrost:8080/v1"
        HERMES_MODEL_NAME: "hermes-3-llama-3.1-8b"
        ZCP_NATS_URL: ${nats_connectionString}
      start: python apps/hermes/main.py
      healthCheck:
        httpGet:
          port: 8000
          path: /healthz
