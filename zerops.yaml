# zerops-astrobranding is the sovereign Catalog, Recipes, Blueprints & ZCP Tooling Hub.
# Modular application services live in standalone baiosfera/* repositories:
#   - Web frontend/SSR: baiosfera/template-astro-web (ubuntu/bun@1.4)
#   - Runtime services: baiosfera/runtime-{bifrost,freellmapi,hermes,pidev,paperclip,evolution,whatsappbot,videoworker}
zerops:
  - setup: catalog
    build:
      base: ubuntu/bun@1.4
      buildCommands:
        - bash -n iniciar.sh scripts/*.sh
        - python3 -B scripts/hooks/tool-guard.py --test
      deployFiles:
        - .
    run:
      base: ubuntu/bun@1.4
      start: sleep infinity
