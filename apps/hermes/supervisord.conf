[supervisord]
nodaemon=true
user=zerops
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:hermes_core]
command=python apps/hermes/main.py
directory=/var/www
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:hermes_telegram]
command=python apps/hermes/telegram_gateway.py
directory=/var/www
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
