zerops:
  - setup: pidev
    build:
      base: ubuntu/nodejs@26
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y --no-install-recommends git curl ca-certificates tar gzip build-essential
        - npm install -g --ignore-scripts @earendil-works/pi-coding-agent gentle-pi
      buildCommands:
        - gentle-shell setup || true
      deployFiles:
        - .
    run:
      base: ubuntu/nodejs@26
      volume:
        hostname: localstorage
        mountPath: /mnt/localstorage
        readOnly: false
      ports:
        - port: 3000
          httpSupport: true
      initCommands:
        - sudo mkdir -p /mnt/localstorage/pidev /var/www/webdev && sudo chown -R zerops:zerops /mnt/localstorage/pidev /var/www/webdev
        - sudo npm install -g --ignore-scripts @earendil-works/pi-coding-agent gentle-pi || true
        - sudo mkdir -p /home/zerops/.local/lib/node_modules/gentle-pi/.gentle-ai/v4.4.0 && sudo cp -f /mnt/localstorage/bin/gentle-ai /home/zerops/.local/lib/node_modules/gentle-pi/.gentle-ai/v4.4.0/gentle-ai && sudo chmod +x /home/zerops/.local/lib/node_modules/gentle-pi/.gentle-ai/v4.4.0/gentle-ai || true
        - sudo chown -R zerops:zerops /home/zerops
      envVariables:
        PORT: "3000"
        HOST: "0.0.0.0"
        NODE_ENV: "production"
        NATS_URL: ${nats_connectionString}
        PI_READ_ONLY: "false"
        PI_OBSERVATIONAL_ONLY: "false"
        GENTLE_SHELL_NO_AUTO_SETUP: "1"
        GENTLE_SHELL_HOME: "/mnt/localstorage/pidev/gentle-shell"
        PI_CODING_AGENT_DIR: "/mnt/localstorage/pidev/pi"
        OPENAI_BASE_URL: "http://bifrost:8080/v1"
        OPENAI_API_KEY: "vk-pidev"
      start: node server.mjs
