name: Catalog & Scripts CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Vault & Env Unit Tests
        run: python3 -m unittest scripts/tests/test_vault_env.py -v

      - name: Check Bash Syntax
        run: |
          bash -n iniciar.sh
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Check Python Bytecode Compilation
        run: python3 -m py_compile scripts/lib/*.py scripts/hooks/*.py
